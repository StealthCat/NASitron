name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      NASITRON_DATA_DIR: /tmp/nasitron-ci
      NASITRON_SECRET_KEY: ci-secret-0123456789abcdef0123456789abcdef
      NASITRON_WEB_USERNAME: ci-admin
      NASITRON_WEB_PASSWORD: ci-password-strong
      NASITRON_ALLOW_INSECURE_HTTP: "true"
      NASITRON_ALLOW_INSECURE_MAINTENANCE: "true"
      WEB_CONCURRENCY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: pip check
      - run: python -m compileall -q app tests remote
      - run: ruff check app tests remote --select E4,E7,E9,F
      - run: python -m pytest -q
      - name: Validate Compose
        run: |
          docker compose config >/dev/null
          NASITRON_LISTEN_IP=127.0.0.1 NASITRON_HTTP_PORT=18080 NASITRON_HTTPS_PORT=18443 docker compose config > /tmp/nasitron-compose.yml
          grep -q 'host_ip: 127.0.0.1' /tmp/nasitron-compose.yml
          grep -q 'published: "18080"' /tmp/nasitron-compose.yml
          grep -q 'published: "18443"' /tmp/nasitron-compose.yml
      - name: Validate Caddy bootstrap configuration
        run: |
          docker run --rm             -e NASITRON_TLS_HOST=localhost             -v "$PWD/deploy/Caddyfile.bootstrap:/etc/caddy/Caddyfile:ro"             caddy:2.11.4-alpine             caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Docker build
        run: docker build -t nasitron-ci .
      - name: Docker startup smoke test
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name nasitron-ci-run -p 127.0.0.1:18080:8080             -e NASITRON_SECRET_KEY=ci-secret-0123456789abcdef0123456789abcdef             -e NASITRON_WEB_USERNAME=ci-admin             -e NASITRON_WEB_PASSWORD=ci-password-strong             -e NASITRON_ALLOW_INSECURE_HTTP=true             nasitron-ci
          trap 'docker logs nasitron-ci-run || true; docker rm -f nasitron-ci-run || true' EXIT

          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/healthz >/dev/null; then
              break
            fi
            sleep 1
          done

          login_html="$(curl -fsS -c /tmp/nasitron-cookies http://127.0.0.1:18080/login)"
          csrf="$(printf '%s' "$login_html" | sed -n 's/.*name="csrf_token" value="\([^"]*\)".*/\1/p' | head -n1)"
          test -n "$csrf"

          curl -fsS -b /tmp/nasitron-cookies -c /tmp/nasitron-cookies             -X POST             --data-urlencode "username=ci-admin"             --data-urlencode "password=ci-password-strong"             --data-urlencode "csrf_token=$csrf"             --data-urlencode "next=/"             http://127.0.0.1:18080/login >/dev/null

          curl -fsS -b /tmp/nasitron-cookies http://127.0.0.1:18080/ >/dev/null
