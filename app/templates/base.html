<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% block title %}NASitron{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/app.js"></script>
</head>
<body>
<nav>
  <a class="brand" href="/">NASitron</a>
  <a href="/">Dashboard</a>
  <a href="/alerts">Alerts</a>
  <a href="/settings">Settings</a>
  <span class="spacer"></span>
  <button type="button" onclick="toggleTheme()" title="Toggle light/dark theme">◐ Theme</button>
</nav>
<main>
  {% block content %}{% endblock %}
</main>
<footer>NASitron · agentless ZFS health monitoring over SSH</footer>
</body>
</html>
