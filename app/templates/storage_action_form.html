{% if data.actions %}<section class="panel zfs-workspace"><h2>Prepare an action</h2><form method="post" action="/servers/{{ server.id }}/zfs-actions/preview" id="storage-action-form"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input type="hidden" name="pool" value="host"><div class="grid two"><label>Action<select name="action">{% for a in data.actions if (active_tab=='datasets' and (a.id.startswith('dataset-') or a.id=='zvol-create')) or (active_tab=='snapshots' and a.id.startswith('snapshot-')) or (active_tab=='host' and (a.id.startswith('helper-') or a.id.startswith('smart-'))) %}<option value="{{ a.id }}" data-warning="{{ a.warning }}">{{ a.label }}</option>{% endfor %}</select></label><label id="storage-target">Target dataset / snapshot / by-id disk<input name="target" list="storage-targets" placeholder="pool/dataset@snapshot"><datalist id="storage-targets">{% for d in data.datasets or [] %}<option value="{{ d.name }}">{% endfor %}{% for s in data.snapshots or [] %}<option value="{{ s.name }}">{% endfor %}</datalist></label><label id="storage-property">Dataset property<select name="property">{% for p in ['compression','recordsize','quota','refquota','reservation','refreservation','atime','readonly','sync','mountpoint'] %}<option>{{ p }}</option>{% endfor %}</select></label><label id="storage-value">Value / zvol size<input name="value" placeholder="lz4, 128K, 100G, on…"></label><label id="storage-clone">Clone destination<input name="new_pool" placeholder="pool/recovery"></label></div><p class="message" id="storage-action-warning" role="status"></p><p class="subtle">Use a full new child name for creation, or dataset@snapshot for snapshot actions. Mountpoint changes are restricted to /mnt and /srv. Review the exact command and type its confirmation on the next page.</p><button class="primary">Review command →</button></form></section>{% endif %}
