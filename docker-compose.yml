services:
  nasitron:
    build: .
    container_name: nasitron
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      NASITRON_SECRET_KEY: "${NASITRON_SECRET_KEY:?Set NASITRON_SECRET_KEY in .env}"
      NASITRON_DATA_DIR: /data
      NASITRON_TIMEZONE: "${NASITRON_TIMEZONE:-UTC}"
      NASITRON_WEB_USERNAME: "${NASITRON_WEB_USERNAME:-}"
      NASITRON_WEB_PASSWORD: "${NASITRON_WEB_PASSWORD:-}"
    volumes:
      - nasitron_data:/data

volumes:
  nasitron_data:
